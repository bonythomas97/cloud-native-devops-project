apiVersion: apps/v1
kind: Deployment
metadata:
  name: nodejs-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nodejs-app
  template:
    metadata:
      labels:
        app: nodejs-app
    spec:
      containers:
      - name: nodejs-container
        image: bonydevopsacr.azurecr.io/nodejs-devops-app:2.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
